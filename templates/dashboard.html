<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ExamLock Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        .topbar {
            background: #0f172a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc2626;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 13px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        .form {
            display: grid;
            grid-template-columns:
                1fr 1fr 1fr 1fr auto;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            text-align: left;
            padding: 14px;
            font-size: 13px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .qr {
            background: #0f172a;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .qr:hover {
            background: #1e293b;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 25px;
        }

        .message {
            background: #dbeafe;
            color: #1e40af;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
